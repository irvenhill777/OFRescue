
name: OFRescue Boston Recovery Build

on:
  workflow_dispatch:
    inputs:
      MANIFEST_URL:
        description: 'OrangeFox manifest Git URL'
        required: true
        type: string
      MANIFEST_BRANCH:
        description: 'Manifest branch'
        required: true
        type: string
      DEVICE_TREE_URL:
        description: 'Boston device tree Git URL'
        required: true
        type: string
      DEVICE_TREE_BRANCH:
        description: 'Device tree branch'
        required: true
        type: string
      DEVICE_PATH:
        description: 'Device tree path inside source'
        required: true
        default: 'device/motorola/boston'
        type: string
      DEVICE_NAME:
        description: 'Device codename'
        required: true
        default: 'boston'
        type: string
      MAKEFILE_NAME:
        description: 'Lunch product name without -eng'
        required: true
        type: string
      BUILD_TARGET:
        description: 'Build target'
        required: true
        default: 'recovery'
        type: choice
        options:
          - recovery
          - boot
          - vendorboot
      USER_NAME:
        description: 'Git username'
        required: true
        default: 'OFRescue Builder'
        type: string
      USER_EMAIL:
        description: 'Git email'
        required: true
        default: 'ofrescue-builder@example.invalid'
        type: string

permissions:
  contents: read

concurrency:
  group: ofrescue-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Boston Recovery
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      MANIFEST_URL: ${{ inputs.MANIFEST_URL }}
      MANIFEST_BRANCH: ${{ inputs.MANIFEST_BRANCH }}
      DEVICE_TREE_URL: ${{ inputs.DEVICE_TREE_URL }}
      DEVICE_TREE_BRANCH: ${{ inputs.DEVICE_TREE_BRANCH }}
      DEVICE_PATH: ${{ inputs.DEVICE_PATH }}
      DEVICE_NAME: ${{ inputs.DEVICE_NAME }}
      MAKEFILE_NAME: ${{ inputs.MAKEFILE_NAME }}
      BUILD_TARGET: ${{ inputs.BUILD_TARGET }}
      USER_NAME: ${{ inputs.USER_NAME }}
      USER_EMAIL: ${{ inputs.USER_EMAIL }}

    steps:
      - name: Checkout OFRescue
        uses: actions/checkout@v4

      - name: Validate build inputs
        shell: bash
        run: |
          set -euo pipefail

          for name in \
            MANIFEST_URL MANIFEST_BRANCH \
            DEVICE_TREE_URL DEVICE_TREE_BRANCH \
            DEVICE_PATH DEVICE_NAME MAKEFILE_NAME \
            BUILD_TARGET USER_NAME USER_EMAIL
          do
            if [ -z "${!name}" ]; then
              echo "::error::$name cannot be empty."
              exit 1
            fi
          done

          case "$MANIFEST_URL" in
            https://*|git@github.com:*)
              ;;
            *)
              echo "::error::Unsupported manifest URL."
              exit 1
              ;;
          esac

          case "$DEVICE_TREE_URL" in
            https://*|git@github.com:*)
              ;;
            *)
              echo "::error::Unsupported device tree URL."
              exit 1
              ;;
          esac

          if [[ ! "$DEVICE_PATH" =~ ^[A-Za-z0-9._/-]+$ ]] ||
             [[ "$DEVICE_PATH" == /* ]] ||
             [[ "$DEVICE_PATH" == *".."* ]]; then
            echo "::error::Invalid device tree path."
            exit 1
          fi

          if [[ ! "$DEVICE_NAME" =~ ^[A-Za-z0-9_-]+$ ]]; then
            echo "::error::Invalid device name."
            exit 1
          fi

          if [[ ! "$MAKEFILE_NAME" =~ ^[A-Za-z0-9_-]+$ ]]; then
            echo "::error::Invalid lunch product."
            exit 1
          fi

          case "$BUILD_TARGET" in
            recovery|boot|vendorboot)
              ;;
            *)
              echo "::error::Unsupported build target."
              exit 1
              ;;
          esac

          echo "Build inputs passed validation."
          echo "Device: $DEVICE_NAME"
          echo "Device path: $DEVICE_PATH"
          echo "Build target: $BUILD_TARGET"

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            git curl wget aria2 \
            zip unzip rsync \
            python3 python-is-python3 \
            openjdk-17-jdk \
            bc bison build-essential \
            flex g++-multilib gcc-multilib \
            libncurses-dev libssl-dev \
            libxml2-utils lz4 \
            zlib1g-dev

      - name: Setup OrangeFox build environment
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/ofx_scripts"

          git clone \
            https://gitlab.com/OrangeFox/misc/scripts \
            "$HOME/ofx_scripts/scripts"

          cd "$HOME/ofx_scripts/scripts"

          sudo bash setup/android_build_env.sh

      - name: Install repo tool
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/bin"

          curl -fL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"

          chmod +x "$HOME/bin/repo"

          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Configure Git
        shell: bash
        run: |
          set -euo pipefail

          git config --global user.name "$USER_NAME"
          git config --global user.email "$USER_EMAIL"

      - name: Initialize OrangeFox source
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p workspace
          cd workspace

          repo init \
            --depth=1 \
            -u "$MANIFEST_URL" \
            -b "$MANIFEST_BRANCH"

      - name: Synchronize source
        shell: bash
        working-directory: workspace
        run: |
          set -euo pipefail

          repo sync \
            -c \
            --no-clone-bundle \
            --no-tags \
            --optimized-fetch \
            --prune \
            --force-sync \
            -j2

      - name: Clone Boston device tree
        shell: bash
        working-directory: workspace
        run: |
          set -euo pipefail

          mkdir -p "$(dirname "$DEVICE_PATH")"

          git clone \
            --depth=1 \
            --branch "$DEVICE_TREE_BRANCH" \
            "$DEVICE_TREE_URL" \
            "$DEVICE_PATH"

          if [ ! -d "$DEVICE_PATH" ]; then
            echo "::error::Device tree directory was not created."
            exit 1
          fi

          echo "Device tree cloned successfully."

      - name: Configure swap space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: Verify build configuration
        shell: bash
        working-directory: workspace
        run: |
          set -euo pipefail

          if [ ! -f build/envsetup.sh ]; then
            echo "::error::Missing build/envsetup.sh."
            exit 1
          fi

          if [ ! -f "$DEVICE_PATH/AndroidProducts.mk" ] &&
             [ ! -f "$DEVICE_PATH/BoardConfig.mk" ]; then
            echo "::error::Device tree build files were not found."
            exit 1
          fi

          echo "Build configuration files found."

      - name: Build recovery image
        shell: bash
        working-directory: workspace
        run: |
          set -euo pipefail

          source build/envsetup.sh

          export ALLOW_MISSING_DEPENDENCIES=true

          lunch "${MAKEFILE_NAME}-eng"

          make clean

          make "${BUILD_TARGET}image" -j2

      - name: Verify build output
        shell: bash
        working-directory: workspace
        run: |
          set -euo pipefail

          OUTPUT_DIR="out/target/product/$DEVICE_NAME"

          if [ ! -d "$OUTPUT_DIR" ]; then
            echo "::error::Build output directory is missing."
            exit 1
          fi

          find "$OUTPUT_DIR" -maxdepth 1 -type f -name '*.img' -print

          if [ ! -f "$OUTPUT_DIR/${BUILD_TARGET}.img" ]; then
            echo "::error::Expected image was not produced."
            exit 1
          fi

          echo "Build output verified."

      - name: Upload recovery artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OFRescue-Boston-Recovery-${{ github.run_number }}
          path: |
            workspace/out/target/product/${{ inputs.DEVICE_NAME }}/*.img
            workspace/out/target/product/${{ inputs.DEVICE_NAME }}/*.zip
          if-no-files-found: error
          retention-days: 14
