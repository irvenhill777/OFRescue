name: OFRescue Boston Recovery Build

on:
  workflow_dispatch:
    inputs:
      MANIFEST_URL:
        description: "OrangeFox sync repository URL"
        required: true
        type: string
        default: "https://gitlab.com/OrangeFox/sync.git"

      MANIFEST_BRANCH:
        description: "OrangeFox release branch"
        required: true
        type: string
        default: "12.1"

      DEVICE_TREE_URL:
        description: "Boston device tree Git URL"
        required: true
        type: string
        default: "https://github.com/luhhcarrl2x-commits/android_device_motorola_boston.git"

      DEVICE_TREE_BRANCH:
        description: "Boston device tree branch"
        required: true
        type: string
        default: "TWRP"

      DEVICE_TREE_PATH:
        description: "Device tree destination"
        required: true
        type: string
        default: "device/motorola/boston"

      DEVICE_NAME:
        description: "Device codename"
        required: true
        type: string
        default: "boston"

      LUNCH_PRODUCT:
        description: "Recovery lunch product"
        required: true
        type: string
        default: "twrp_boston"

      BUILD_TARGET:
        description: "Build target"
        required: true
        type: choice
        options:
          - recoveryimage
        default: recoveryimage

permissions:
  contents: read

concurrency:
  group: ofrescue-boston-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build OrangeFox for Boston
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      MANIFEST_URL: ${{ inputs.MANIFEST_URL }}
      FOX_BRANCH: ${{ inputs.MANIFEST_BRANCH }}
      DEVICE_TREE_URL: ${{ inputs.DEVICE_TREE_URL }}
      DEVICE_TREE_BRANCH: ${{ inputs.DEVICE_TREE_BRANCH }}
      DEVICE_TREE_PATH: ${{ inputs.DEVICE_TREE_PATH }}
      DEVICE_NAME: ${{ inputs.DEVICE_NAME }}
      LUNCH_PRODUCT: ${{ inputs.LUNCH_PRODUCT }}
      BUILD_TARGET: ${{ inputs.BUILD_TARGET }}
      BUILD_DIR: ${{ github.workspace }}/fox_12.1

    steps:
      - name: Checkout OFRescue
        uses: actions/checkout@v4

      - name: Show build configuration
        shell: bash
        run: |
          set -e
          echo "Device: $DEVICE_NAME"
          echo "OrangeFox branch: $FOX_BRANCH"
          echo "Device tree: $DEVICE_TREE_URL"
          echo "Device tree branch: $DEVICE_TREE_BRANCH"
          echo "Lunch product: $LUNCH_PRODUCT"
          echo "Build target: $BUILD_TARGET"
          echo "Build directory: $BUILD_DIR"

      - name: Install build dependencies
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            g++-multilib \
            gcc-multilib \
            git \
            git-lfs \
            gnupg \
            gperf \
            imagemagick \
            lib32ncurses-dev \
            lib32readline-dev \
            lib32z1-dev \
            libelf-dev \
            liblz4-tool \
            libncurses-dev \
            libssl-dev \
            libxml2 \
            libxml2-utils \
            lzop \
            openjdk-17-jdk \
            pngcrush \
            python3 \
            python-is-python3 \
            rsync \
            schedtool \
            squashfs-tools \
            unzip \
            xsltproc \
            zip \
            zlib1g-dev

          git config --global user.name "OFRescue Builder"
          git config --global user.email "ofrescue-builder@users.noreply.github.com"

      - name: Install Google Repo tool
        shell: bash
        run: |
          set -e

          curl -fsSL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$RUNNER_TEMP/repo"

          chmod +x "$RUNNER_TEMP/repo"

          sudo install -m 0755 \
            "$RUNNER_TEMP/repo" \
            /usr/local/bin/repo

          echo "Google Repo tool installed."
          repo --version

      - name: Clone and sync OrangeFox sources
        shell: bash
        run: |
          set -e

          SYNC_DIR="$RUNNER_TEMP/orangefox-sync"
          SYNC_SCRIPT="$SYNC_DIR/orangefox_sync.sh"

          git clone --depth=1 \
            "$MANIFEST_URL" \
            "$SYNC_DIR"

          if [ ! -f "$SYNC_SCRIPT" ]; then
            echo "::error::OrangeFox sync script not found."
            exit 1
          fi

          if [ ! -d "$SYNC_DIR/patches" ]; then
            echo "::error::OrangeFox patches directory is missing."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/patches"

          cp -a "$SYNC_DIR/patches/." \
            "$GITHUB_WORKSPACE/patches/"

          for patch in \
            patch-manifest-fox_12.1.diff \
            patch-system-fox_12.1.diff \
            patch-vendor-twrp-fox_12.1.diff
          do
            if [ ! -s "$GITHUB_WORKSPACE/patches/$patch" ]; then
              echo "::error::Required OrangeFox patch missing: $patch"
              echo "Available patches:"
              find "$SYNC_DIR/patches" -maxdepth 1 -type f -printf '%f\n'
              exit 1
            fi
          done

          echo "All required OrangeFox patches are installed."

          chmod +x "$SYNC_SCRIPT"
          cd "$GITHUB_WORKSPACE"

          bash "$SYNC_SCRIPT" \
            --branch "$FOX_BRANCH" \
            --path "$BUILD_DIR"

          echo "OrangeFox synchronization finished."

      - name: Verify Android source tree
        shell: bash
        run: |
          set -e
          cd "$BUILD_DIR"

          if [ ! -f build/envsetup.sh ]; then
            echo "::error::Android build/envsetup.sh is missing."
            exit 1
          fi

          echo "Android source tree verified."

      - name: Add Boston device tree
        shell: bash
        run: |
          set -e
          cd "$BUILD_DIR"

          mkdir -p "$(dirname "$DEVICE_TREE_PATH")"
          rm -rf "$DEVICE_TREE_PATH"

          git clone --depth=1 \
            --branch "$DEVICE_TREE_BRANCH" \
            "$DEVICE_TREE_URL" \
            "$DEVICE_TREE_PATH"

          echo "Boston device tree downloaded."

      - name: Verify Boston device tree
        shell: bash
        run: |
          set -e
          cd "$BUILD_DIR"

          test -f "$DEVICE_TREE_PATH/AndroidProducts.mk"
          test -f "$DEVICE_TREE_PATH/BoardConfig.mk"

          echo "Boston device tree files found."
          echo "Available product definitions:"
          cat "$DEVICE_TREE_PATH/AndroidProducts.mk"

      - name: Configure build environment
        shell: bash
        run: |
          set -e
          cd "$BUILD_DIR"

          export FOX_BUILD_DEVICE="$DEVICE_NAME"
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C

          echo "Loading OrangeFox build environment..."

          set +e
          source build/envsetup.sh
          SOURCE_STATUS=$?
          set -e

          echo "envsetup.sh returned: $SOURCE_STATUS"

          if ! type lunch >/dev/null 2>&1; then
            echo "::error::The lunch command was not loaded."
            exit 1
          fi

          echo "Checking Boston lunch product..."
          lunch "${LUNCH_PRODUCT}-eng"

          echo "Boston build environment configured."

      - name: Build Boston recovery image
        shell: bash
        run: |
          set -e
          cd "$BUILD_DIR"

          export FOX_BUILD_DEVICE="$DEVICE_NAME"
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C

          echo "Reloading Android build environment..."

          set +e
          source build/envsetup.sh
          SOURCE_STATUS=$?
          set -e

          echo "envsetup.sh returned: $SOURCE_STATUS"

          if ! type lunch >/dev/null 2>&1; then
            echo "::error::lunch command is unavailable."
            exit 1
          fi

          echo "Selecting Boston recovery product..."
          lunch "${LUNCH_PRODUCT}-eng"

          echo "Starting OrangeFox build..."
          echo "Build target: $BUILD_TARGET"

          mka adbd "$BUILD_TARGET" -j2

          echo "Recovery build command completed."

      - name: Verify and stage recovery image
        shell: bash
        run: |
          set -e

          OUTPUT_DIR="$BUILD_DIR/out/target/product"
          mkdir -p "$GITHUB_WORKSPACE/artifacts"

          echo "Searching for generated recovery image..."

          RECOVERY_IMAGE="$(find "$OUTPUT_DIR" \
            -type f \
            -name recovery.img \
            -size +0c \
            -print -quit)"

          if [ -z "$RECOVERY_IMAGE" ]; then
            echo "::error::No non-empty recovery.img was found."
            echo "Available output directories:"
            find "$OUTPUT_DIR" -maxdepth 3 -type d 2>/dev/null || true
            echo "Available image files:"
            find "$OUTPUT_DIR" -type f \
              \( -name '*.img' -o -name '*.zip' \) \
              2>/dev/null || true
            exit 1
          fi

          echo "Recovery image found:"
          ls -lh "$RECOVERY_IMAGE"

          cp "$RECOVERY_IMAGE" \
            "$GITHUB_WORKSPACE/artifacts/recovery.img"

          sha256sum "$GITHUB_WORKSPACE/artifacts/recovery.img"

          echo "Recovery image staged for artifact upload."

      - name: Upload Boston recovery artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OFRescue-Boston-Recovery
          path: artifacts/recovery.img
          if-no-files-found: error
          compression-level: 0
          retention-days: 14