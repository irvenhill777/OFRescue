name: OFRescue Boston Recovery Build

on:
  workflow_dispatch:
    inputs:
      MANIFEST_URL:
        description: "OrangeFox sync repository URL"
        required: true
        type: string
        default: "https://gitlab.com/OrangeFox/sync.git"

      MANIFEST_BRANCH:
        description: "OrangeFox release branch"
        required: true
        type: string
        default: "12.1"

      DEVICE_TREE_URL:
        description: "Boston device tree Git URL"
        required: true
        type: string
        default: "https://github.com/luhhcarrl2x-commits/android_device_motorola_boston.git"

      DEVICE_TREE_BRANCH:
        description: "Boston device tree branch"
        required: true
        type: string
        default: "TWRP"

      DEVICE_TREE_PATH:
        description: "Device tree destination"
        required: true
        type: string
        default: "device/motorola/boston"

      DEVICE_NAME:
        description: "Device codename"
        required: true
        type: string
        default: "boston"

      LUNCH_PRODUCT:
        description: "Recovery lunch product"
        required: true
        type: string
        default: "twrp_boston"

      BUILD_TARGET:
        description: "Build target"
        required: true
        type: choice
        options:
          - recoveryimage
        default: recoveryimage

permissions:
  contents: read

concurrency:
  group: ofrescue-boston-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build OrangeFox for Boston
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      MANIFEST_URL: ${{ inputs.MANIFEST_URL }}
      FOX_BRANCH: ${{ inputs.MANIFEST_BRANCH }}
      DEVICE_TREE_URL: ${{ inputs.DEVICE_TREE_URL }}
      DEVICE_TREE_BRANCH: ${{ inputs.DEVICE_TREE_BRANCH }}
      DEVICE_TREE_PATH: ${{ inputs.DEVICE_TREE_PATH }}
      DEVICE_NAME: ${{ inputs.DEVICE_NAME }}
      LUNCH_PRODUCT: ${{ inputs.LUNCH_PRODUCT }}
      BUILD_TARGET: ${{ inputs.BUILD_TARGET }}
      BUILD_DIR: ${{ github.workspace }}/fox_12.1

    steps:
      - name: Checkout OFRescue
        uses: actions/checkout@v4

      - name: Show build configuration
        shell: bash
        run: |
          echo "Device: $DEVICE_NAME"
          echo "OrangeFox branch: $FOX_BRANCH"
          echo "Device tree: $DEVICE_TREE_URL"
          echo "Device tree branch: $DEVICE_TREE_BRANCH"
          echo "Build directory: $BUILD_DIR"

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            g++-multilib \
            gcc-multilib \
            git \
            git-lfs \
            gnupg \
            gperf \
            imagemagick \
            lib32ncurses-dev \
            lib32readline-dev \
            lib32z1-dev \
            libelf-dev \
            liblz4-tool \
            libncurses-dev \
            libssl-dev \
            libxml2 \
            libxml2-utils \
            lzop \
            openjdk-17-jdk \
            pngcrush \
            python3 \
            python-is-python3 \
            rsync \
            schedtool \
            squashfs-tools \
            unzip \
            xsltproc \
            zip \
            zlib1g-dev

          git config --global user.name "OFRescue Builder"
          git config --global user.email "ofrescue-builder@users.noreply.github.com"

      - name: Clone and sync OrangeFox sources
        shell: bash
        run: |
          set -e

          SYNC_DIR="$RUNNER_TEMP/orangefox-sync"
          SYNC_SCRIPT="$SYNC_DIR/orangefox_sync.sh"
          PATCH_FILE="$SYNC_DIR/patches/patch-manifest-fox_12.1.diff"

          # Download official OrangeFox sync tools.
          git clone --depth=1 \
            "$MANIFEST_URL" \
            "$SYNC_DIR"

          # Verify sync script.
          if [ ! -f "$SYNC_SCRIPT" ]; then
            echo "::error::OrangeFox sync script not found."
            exit 1
          fi

          # Verify official manifest patch.
          if [ ! -s "$PATCH_FILE" ]; then
            echo "::error::Official OrangeFox 12.1 patch not found."
            find "$SYNC_DIR" -maxdepth 3 -type f
            exit 1
          fi

          # Copy patch to the exact location expected by the script.
          mkdir -p "$GITHUB_WORKSPACE/patches"

          cp "$PATCH_FILE" \
            "$GITHUB_WORKSPACE/patches/patch-manifest-fox_12.1.diff"

          # Confirm patch is in place.
          test -s "$GITHUB_WORKSPACE/patches/patch-manifest-fox_12.1.diff"

          echo "OrangeFox 12.1 manifest patch installed."

          # Run official sync script.
          chmod +x "$SYNC_SCRIPT"
          cd "$GITHUB_WORKSPACE"

          bash "$SYNC_SCRIPT" \
            --branch "$FOX_BRANCH" \
            --path "$BUILD_DIR"

          echo "OrangeFox synchronization finished."
      - name: Verify Android source tree
        shell: bash
        run: |
          set -e
          cd "$BUILD_DIR"

          if [ ! -f build/envsetup.sh ]; then
            echo "::error::Android build/envsetup.sh is missing."
            echo "OrangeFox source synchronization did not complete correctly."
            exit 1
          fi

          echo "Android source tree verified."

      - name: Add Boston device tree
        shell: bash
        run: |
          set -e
          cd "$BUILD_DIR"

          mkdir -p "$(dirname "$DEVICE_TREE_PATH")"
          rm -rf "$DEVICE_TREE_PATH"

          git clone --depth=1 \
            --branch "$DEVICE_TREE_BRANCH" \
            "$DEVICE_TREE_URL" \
            "$DEVICE_TREE_PATH"

          echo "Boston device tree downloaded."

      - name: Verify Boston device tree
        shell: bash
        run: |
          set -e
          cd "$BUILD_DIR"

          test -f "$DEVICE_TREE_PATH/AndroidProducts.mk"
          test -f "$DEVICE_TREE_PATH/BoardConfig.mk"

          echo "Boston device tree files found."
          echo "Available product definitions:"
          cat "$DEVICE_TREE_PATH/AndroidProducts.mk"

      - name: Configure build environment
        shell: bash
        run: |
          set -e
          cd "$BUILD_DIR"

          export FOX_BUILD_DEVICE="$DEVICE_NAME"
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C

          source build/envsetup.sh

          lunch "${LUNCH_PRODUCT}-eng"

      - name: Build Boston recovery image
        shell: bash
        run: |
          set -e
          cd "$BUILD_DIR"

          export FOX_BUILD_DEVICE="$DEVICE_NAME"
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C

          source build/envsetup.sh
          lunch "${LUNCH_PRODUCT}-eng"

          echo "Starting recovery build..."
          mka -j2 adbd "$BUILD_TARGET"

      - name: Verify recovery image
        shell: bash
        run: |
          set -e

          RECOVERY_IMAGE="$BUILD_DIR/out/target/product/$DEVICE_NAME/recovery.img"

          if [ ! -s "$RECOVERY_IMAGE" ]; then
            echo "::error::recovery.img was not generated."
            echo "Build output directory:"
            ls -lah "$BUILD_DIR/out/target/product/$DEVICE_NAME/" || true
            exit 1
          fi

          echo "Recovery image successfully generated."
          ls -lh "$RECOVERY_IMAGE"

      - name: Upload Boston recovery artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OFRescue-Boston-Recovery
          path: |
            fox_12.1/out/target/product/boston/recovery.img
            fox_12.1/out/target/product/boston/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14