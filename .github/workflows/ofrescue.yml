
name: OFRescue Boston Source Package

on:
  workflow_dispatch:
  push:
    branches:
      - Master
    paths:
      - 'gui/**'
      - 'ofrescue/**'
      - 'README.md'
      - '.github/workflows/ofrescue.yml'

permissions:
  contents: read

jobs:
  package:
    name: Validate and Package OFRescue Sources
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare package directory
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p package output
          cp README.md package/README.md

          if [ -d gui ]; then
            cp -R gui package/gui
          fi

          if [ -d ofrescue ]; then
            cp -R ofrescue package/ofrescue
          fi

      - name: Validate available XML files
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import sys
          import xml.etree.ElementTree as ET

          gui = Path("gui")
          xml_files = sorted(gui.rglob("*.xml")) if gui.exists() else []

          if not xml_files:
              print("NOTICE: No GUI XML files are in the repository yet.")
              print("This run creates a source bundle, not a flashable recovery.")
              raise SystemExit(0)

          failed = False
          for path in xml_files:
              try:
                  ET.parse(path)
                  print(f"XML syntax OK: {path}")
              except ET.ParseError as exc:
                  print(f"XML SYNTAX ERROR: {path}: {exc}")
                  failed = True

          if failed:
              raise SystemExit(1)
          PY

      - name: Mark package readiness
        shell: bash
        run: |
          set -euo pipefail

          GUI_PAGE="gui/theme/portrait_hdpi/pages/ofrescue.xml"

          if [ -f "$GUI_PAGE" ]; then
            cat > package/PACKAGE-STATUS.txt <<'EOF'
          OFRescue Boston source bundle
          GUI page source was found and XML syntax validation passed.
          This package is not a flashable recovery image.
          OrangeFox 12.1 integration and device-specific build testing are still required.
          EOF
          else
            cat > package/PACKAGE-STATUS.txt <<'EOF'
          OFRescue Boston source bundle — NOT GUI COMPLETE
          The expected GUI page is missing:
          gui/theme/portrait_hdpi/pages/ofrescue.xml

          This artifact only packages files currently in the repository.
          It is NOT a flashable recovery, installer ZIP, or completed touchscreen interface.
          Add and validate the OrangeFox 12.1 GUI source before recovery integration.
          EOF
          fi

          echo "Package contents:"
          find package -maxdepth 5 -type f -print

      - name: Create ZIP
        shell: bash
        run: |
          set -euo pipefail
          cd package
          zip -qr ../output/OFRescue-Boston-Source-Bundle.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OFRescue-Boston-Source-Bundle
          path: output/OFRescue-Boston-Source-Bundle.zip
          if-no-files-found: error
          retention-days: 30
