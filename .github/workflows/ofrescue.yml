
name: OFRescue Boston Source Package

on:
  workflow_dispatch:
  push:
    branches:
      - Master
    paths:
      - 'gui/**'
      - 'README.md'
      - '.github/workflows/ofrescue.yml'

permissions:
  contents: read

jobs:
  package:
    name: Validate and Package OFRescue
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate XML files
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import sys
          import xml.etree.ElementTree as ET

          required = [
              Path("gui/theme/portrait_hdpi/pages/advanced.xml"),
              Path("gui/theme/portrait_hdpi/pages/ofrescue.xml"),
          ]

          failed = False

          for path in required:
              if not path.is_file():
                  print(f"ERROR: Missing required file: {path}")
                  failed = True

          if failed:
              sys.exit(1)

          xml_files = sorted(Path("gui").rglob("*.xml"))

          for path in xml_files:
              try:
                  root = ET.parse(path).getroot()
                  if root.tag != "recovery":
                      raise ValueError(
                          f"Expected recovery root, found {root.tag}"
                      )
                  print(f"XML syntax OK: {path}")
              except (ET.ParseError, ValueError) as exc:
                  print(f"XML ERROR: {path}: {exc}")
                  failed = True

          if failed:
              sys.exit(1)

          page_file = Path(
              "gui/theme/portrait_hdpi/pages/ofrescue.xml"
          )
          root = ET.parse(page_file).getroot()

          pages = {
              page.attrib.get("name")
              for page in root.findall(".//page")
          }

          expected_pages = {
              "ofrescue",
              "ofrescue_info",
              "ofrescue_diagnostics",
              "ofrescue_backup",
              "ofrescue_builder",
          }

          missing = expected_pages - pages

          if missing:
              print("ERROR: Missing OFRescue pages:", sorted(missing))
              sys.exit(1)

          print("All required OFRescue pages found.")
          print("XML validation completed successfully.")
          PY

      - name: Prepare source package
        shell: bash
        run: |
          set -euo pipefail

          rm -rf package output
          mkdir -p package output

          cp README.md package/README.md
          cp -R gui package/gui

          cat > package/PACKAGE-STATUS.txt <<'EOF'
          OFRescue Boston Source Bundle

          Target device:
          Motorola Moto G Stylus 5G 2024
          Model: XT2419-1
          Codename: Boston

          Recovery target:
          OrangeFox Recovery 12.1

          Package contents:
          - GUI XML source files
          - Project documentation

          Safety:
          This is a source package only.
          It is NOT a flashable recovery image.
          It does not perform partition flashing,
          wiping, formatting, backup, or restore.

          Device-specific integration and hardware testing
          are still required.
          EOF

          echo "Package contents:"
          find package -type f -print

      - name: Create source ZIP
        shell: bash
        run: |
          set -euo pipefail
          cd package
          zip -qr ../output/OFRescue-Boston-Source-Bundle.zip .

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: OFRescue-Boston-Source-Bundle
          path: output/OFRescue-Boston-Source-Bundle.zip
          if-no-files-found: error
          retention-days: 30
